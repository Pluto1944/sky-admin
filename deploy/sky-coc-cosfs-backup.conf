# Drop-in for the existing sky-coc-cosfs.service.
# Keep a 1 GB local safety margin while allowing the daily SQLite snapshots to
# upload on a host whose free root-disk space is below the former 10 GB limit.
[Service]
ExecStart=
ExecStart=/bin/sh -ec '/usr/bin/mountpoint -q /sky_coc || /usr/local/bin/cosfs skycoc-1256606870:/ /sky_coc -ourl=http://cos.ap-shanghai.myqcloud.com -odbglevel=err -oallow_other -opublic_bucket=1 -oensure_diskfree=1024'
