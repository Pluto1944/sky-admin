# Sky Admin Nginx configuration for the pre-ICP-filing IP endpoint.
# Install as /etc/nginx/sites-available/sky-admin-ip and enable it from
# /etc/nginx/sites-enabled/sky-admin-ip.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 115.159.64.19;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://115.159.64.19$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 115.159.64.19;

    ssl_certificate     /etc/letsencrypt/live/115.159.64.19/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/115.159.64.19/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/sky-admin-access.log;
    error_log  /var/log/nginx/sky-admin-error.log;
}
