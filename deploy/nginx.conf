# Sky Admin Nginx 配置
# 安装路径: /etc/nginx/sites-available/sky-admin
# 启用方式: ln -s /etc/nginx/sites-available/sky-admin /etc/nginx/sites-enabled/

# ============================================================
# 阶段一：HTTP 模式（域名审核期间使用）
# ============================================================
server {
    listen 80;
    server_name _;

    # 反代到 FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 日志
    access_log /var/log/nginx/sky-admin-access.log;
    error_log  /var/log/nginx/sky-admin-error.log;
}

