# Sky Admin Nginx 配置
# 安装路径: /etc/nginx/sites-available/sky-admin
# 启用方式: ln -s /etc/nginx/sites-available/sky-admin /etc/nginx/sites-enabled/
#
# 域名: api.skycoc.cc（修改下面 server_name 适配你的域名）

# ============================================================
# HTTP → HTTPS 强制跳转
# ============================================================
server {
    listen 80;
    server_name api.skycoc.cc;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 主配置
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.skycoc.cc;

    # SSL 证书（certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/api.skycoc.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skycoc.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 屏蔽无意义的扫描请求（在 Nginx 层直接处理，不转发到 FastAPI）
    location = /favicon.ico { return 204; }
    location = / {
        return 200 "<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sky Admin API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .card {
            text-align: center;
            padding: 48px 40px;
        }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 1.1rem; opacity: 0.85; margin-bottom: 8px; }
        .status { display: inline-block; margin-top: 24px; padding: 8px 24px; background: rgba(255,255,255,0.15); border-radius: 20px; font-size: 0.95rem; }
        .dot { display: inline-block; width: 10px; height: 10px; background: #4ade80; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class='card'>
        <h1>Sky Admin API</h1>
        <p>服务正常运行中</p>
        <div class='status'><span class='dot'></span>API Online</div>
    </div>
</body>
</html>";
    }

    # 反代到 FastAPI（其他所有请求）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/sky-admin-access.log;
    error_log  /var/log/nginx/sky-admin-error.log;
}
