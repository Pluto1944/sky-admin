# ============================================================================
# 应用全局配置（原 shared/config/common.py）
# ============================================================================
app:
  io_adapter: tencent              # local | tencent
  db_path: data/league.db

# ============================================================================
# 账号体系常量（原 shared/config/common.py）
# ============================================================================
account:
  type:
    combat: combat
    normal: normal
  status:
    active: active
    missed: missed
    maybe_left: maybe_left
    left: left
  membership:
    member: member
    left: left

league:
  type:
    combat: combat
    shell: shell

# ============================================================================
# 玩家模块 - player（原 modules/player/config.py）
# ============================================================================
player:
  maybe_left_months: 2

  export:
    columns:
      player_tag: 玩家Tag
      account_name: 游戏昵称
      player_name: 归属人
      town_hall_level: 大本
      exp_level: 等级
      trophies: 奖杯
      league_name: 段位
      clan_tag: 部落Tag
      clan_role: 部落职位
      membership_status: 部落身份
      status: 报名状态
      history_score: 历史分
      last_reg_period: 最后报名
      last_synced_at: 最后同步
      updated_at: 更新时间
    default_sort: history_score
    default_desc: true
    sheet_name: 玩家档案

