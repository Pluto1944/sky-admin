# ============================================================================
# 联赛报名 - cwl_registration（原 modules/cwl_registration/config.py）
# ============================================================================
cwl_registration:
  sort_weights:
    match_value: 0.6
    history_score: 0.4

  combat_min_match_value: 600

  registration_column_keywords:
    player_name:
      include: [主号游戏昵称, 主号]
      exclude: []
    account_name:
      include: [游戏昵称]
      exclude: [主号]
    match_value:
      include: [匹配值]
      exclude: []
    join_combat:
      include: [想实战]
      exclude: []
    submit_time:
      include: [提交时间]
      exclude: []
    willing_to_manage:
      include: [愿意做联赛管理员]
      exclude: []

  registration_tag_source: account_name
  registration_dedup: latest_submit

  join_combat_true_texts: [是, yes, y, true, "1", 参加]

  camp_clan_tag: "#2QQ"
  excluded_camp_names:
    - Pluto2QQ
    - 落花归尘
    - misael
    - AltriaPendragon
    - 葉丶
